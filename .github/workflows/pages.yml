name: Publish TX1 APT repository

on:
  workflow_run:
    workflows: [Build TX1 Debian packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build run ID to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tx1-debian-packages
          path: packages
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg
      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_GPG_PRIVATE_KEY" || { echo 'Missing APT_GPG_PRIVATE_KEY secret'; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          export APT_SIGNING_KEY="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$APT_SIGNING_KEY"
          (cd packages && sha256sum --check SHA256SUMS)
          bash scripts/make-apt-repo.sh packages pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
